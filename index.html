<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ToDo FP Workflow</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="intro.css">
  <link href="https://fonts.cdnfonts.com/css/dseg14-classic" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/amatic-sc-3" rel="stylesheet">
</head>
<body>

<div class="stars"></div>

<div id="titleScreen">
  <img class="logo" src="assets/AmongUs.png" alt="logo">
  <h1 class="title">ToDo List</h1>
  <img id="goIntroBtn" src="assets/Start.png" alt="START">
</div>

<div id="cardOverlay">

  <div class="terminal">

    <img src="assets/TerminalBack.png" class="layer back">
    <img src="assets/TopSlide.png" class="layer top">
    <img src="assets/Card.png" id="card">
    <img src="assets/BotSlide.png" class="layer bottom">

    <div class="screen-ui">
      <div id="message"></div>
    </div>

    <div class="lights">
      <div class="light red"></div>
      <div class="light green"></div>
    </div>

  </div>

</div>


<!-- TODO APP -->
<div id="appScreen" style="display:none;">

  <!-- ПРОГРЕСС -->
  <div class="progress-container">
    <img class="progress-bg" src="assets/TaskBar.png">
    <div class="progress-fill" id="progressBar"></div>
    <div class="progress-text">TOTAL TASKS COMPLETED</div>
  </div>

  <!-- СТАТИСТИКА -->
  <div class="stats" id="statsBox"></div>

  <!-- РЕЗУЛЬТАТ -->
  <div class="result-modal" id="resultModal" style="display:none;"></div>

  <div class="container">

    <h1>Список задач</h1>

    <div class="input-block" id="inputBlock">
      <input type="text" id="taskInput" placeholder="Введите задачу...">
      <button id="addBtn">Добавить</button>
    </div>

    <button id="confirmBtn" class="confirm-btn">
      Подтвердить список
    </button>

    <p id="errorMsg" class="error-msg"></p>

    <div class="filters" id="filters" style="display:none;">
      <button data-filter="all">Все</button>
      <button data-filter="active">Активные</button>
      <button data-filter="completed">Выполненные</button>
      <button data-filter="rejected">Отклонённые</button>
    </div>

    <ul id="taskList"></ul>

  </div>
</div>

<!-- SCRIPTS -->
<script src="intro.js"></script>
<script src="main.js"></script>

</body>
</html>
